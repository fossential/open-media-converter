slow\ -\ Better\ compression=slow — 更好的压缩
slower\ -\ Much\ better\ compression=slower — 更高的压缩率
superfast\ -\ Very\ fast\ encoding=superfast — 非常快速的编码
ultrafast\ -\ Fastest\ encoding,\ largest\ file=ultrafast — 最快的编码，最大的文件
veryfast\ -\ Fast\ encoding=veryfast — 快速编码
veryslow\ -\ Best\ compression,\ slowest=veryslow — 最佳压缩，速度最慢
