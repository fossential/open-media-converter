name: Test CI

on:
    workflow_call:
    # push:
    #     branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Build Docker image
              run: ./docker-build.sh build

            # Suite requires GTK4, ffmpeg, imagemagick, pandoc, LibreOffice
            # and Xvfb — all provided by the project Docker image (see
            # AGENTS.md).
            - name: Run tests
              run: ./docker-build.sh test

            # Native GTK callbacks need a fresh JVM, separate from mocked widgets.
            - name: Check native UI in every supported language
              timeout-minutes: 10
              run: |
                  docker run --init --rm \
                    -v "$(pwd):/app" \
                    -v "$HOME/.m2:/home/developer/.m2" \
                    omc-dev bash -ec '
                      ulimit -c 0
                      for language in en fr es de pt zh ja; do
                        echo "Native language check: $language"
                        xvfb-run -a mvn -B -pl omc-gtk -am test \
                          -Domc.skipEmbeddedTools=true \
                          -Dtest=I18nGtkTest -Dsurefire.failIfNoSpecifiedTests=false \
                          -Domc.nativeGtk=true -Domc.language="$language"
                      done
                    '
